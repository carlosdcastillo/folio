[workspace]
resolver = "2"
members = ["crates/folio-core", "crates/folio-app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Carlos D. Castillo <carlos.d.castillo@gmail.com>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Release profile tuned for the "native performance religion" in the spec:
# small binary, fast startup.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
